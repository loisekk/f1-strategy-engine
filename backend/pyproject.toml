[project]
name = "f1-strategy-engine-api"
version = "1.0.0"
description = "ML serving layer for the F1 Strategy Engine — model registry, session-persistent inference, strategy simulation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "xgboost>=2.1",
    "joblib>=1.4",
    "python-multipart>=0.0.9",
]

[tool.uv]
package = false
